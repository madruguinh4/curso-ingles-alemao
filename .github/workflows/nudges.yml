name: Lembretes diários (push)

on:
  schedule:
    - cron: '0 * * * *'   # de hora em hora (UTC); o script decide pelo fuso de cada aluno
  workflow_dispatch:
    inputs:
      force:
        description: 'Teste: enviar a 1ª mensagem para todos agora'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/send-nudges.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          APP_URL: ${{ vars.APP_URL }}
          FORCE: ${{ inputs.force == true && '1' || '' }}
