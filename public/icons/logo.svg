<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Marca: balão de fala branco com uma faísca âmbar — "conversa que acende".
       Fundo em gradiente azul→roxo (o mesmo do app). Conteúdo dentro da zona
       segura (80%) para ícone maskable no Android. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1e1b4b" flood-opacity=".45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- brilho suave atrás do balão -->
  <circle cx="256" cy="236" r="150" fill="url(#glow)" filter="url(#soft)"/>

  <!-- balão branco -->
  <g filter="url(#shadow)">
    <path d="M118 176c0-34 27-61 61-61h154c34 0 61 27 61 61v104c0 34-27 61-61 61H236l-62 56v-56h4c-34 0-60-27-60-61z" fill="#ffffff"/>
  </g>

  <!-- faísca âmbar (4 pontas) + duas menores -->
  <g fill="url(#spark)">
    <path d="M256 152c6 44 22 60 66 66-44 6-60 22-66 66-6-44-22-60-66-66 44-6 60-22 66-66z"/>
    <path d="M332 270c2.6 19 9.5 26 28.5 28.5-19 2.6-26 9.5-28.5 28.5-2.6-19-9.5-26-28.5-28.5 19-2.6 26-9.5 28.5-28.5z" opacity=".9"/>
    <path d="M176 258c2 14 7 19 21 21-14 2-19 7-21 21-2-14-7-19-21-21 14-2 19-7 21-21z" opacity=".85"/>
  </g>
</svg>
