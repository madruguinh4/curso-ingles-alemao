<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Logo: dois balões de fala — inglês (azul) e alemão (âmbar) — que se encontram.
       Fundo navy do tema. Conteúdo dentro da zona segura (80%) para ícone maskable. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b33"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- balão azul (atrás, à esquerda, mais alto) -->
  <g filter="url(#shadow)">
    <path d="M118 137c0-26 21-47 47-47h132c26 0 47 21 47 47v88c0 26-21 47-47 47H208l-46 40v-40h-1c-24 0-43-19-43-43z" fill="url(#blue)"/>
    <text x="231" y="207" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="800" fill="#fff" text-anchor="middle">EN</text>
  </g>
  <!-- balão âmbar (na frente, à direita, mais baixo) -->
  <g filter="url(#shadow)">
    <path d="M394 277c0-26-21-47-47-47H215c-26 0-47 21-47 47v88c0 26 21 47 47 47h96l46 40v-40h1c24 0 43-19 43-43z" fill="url(#amber)"/>
    <text x="281" y="349" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="800" fill="#1a1207" text-anchor="middle">DE</text>
  </g>
</svg>
